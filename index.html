  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

rap\" style-hover=\"background:var(--color-neutral-300)\" style-active=\"transform:translateY(1px)\">{{ icoCopiar }}Copiar tabla<\u002Fbutton>\n            <\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ regenerar }}\" style=\"border-radius:12px; background:transparent; border:1px solid var(--ios-sep); padding:{{ padSec }}; font-size:12px; font-weight:700; letter-spacing:0.02em; text-transform:none; text-align:left\" style-hover=\"background:var(--color-surface)\" style-active=\"background:var(--color-neutral-200); transform:translateY(1px)\">Generar fixture<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"border-bottom:1px solid var(--ios-sep); margin-top:12px\"><\u002Fdiv>\n            <div style=\"margin-top:18px; padding-bottom:20px; border-bottom:2px solid var(--color-text)\">\n              <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap\">\n                <div>\n                  <div style=\"font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700)\">Programación unificada · Libre, Master y Damas<\u002Fdiv>\n                  <div style=\"font-size:22px; font-weight:700; letter-spacing:-0.02em; margin-top:2px\">Domingo {{ progFechaSel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap\">\n                  <div style=\"display:flex; flex-direction:column; gap:4px; font-size:11px; font-weight:700; color:var(--color-neutral-700)\">Partidos por equipo<span style=\"font-size:13px; color:var(--color-text); padding:7px 0\">{{ progMaxTxt }}<\u002Fspan><\u002Fdiv>\n                  <label style=\"display:flex; flex-direction:column; gap:4px; font-size:11px; font-weight:700; color:var(--color-neutral-700)\">Cada (min)<input type=\"number\" min=\"20\" max=\"240\" step=\"5\" value=\"{{ progCada }}\" sc-camel-on-change=\"{{ rder:1px dashed var(--color-neutral-400)\">\n                  <image-slot id=\"logo-liga-dominical\" shape=\"rect\" fit=\"contain\" placeholder=\"Arrastra el PNG del logo\" src=\"dc65e433-fb4b-4970-9521-6ae1299cd4bf\"><\u002Fimage-slot>\n                <\u002Fdiv>\n                <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:8px; max-width:150px\">PNG con fondo transparente, cuadrado.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"flex:1 1 260px; min-width:240px\">\n                <label style=\"display:block\">\n                  <span style=\"display:block; font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:6px\">Texto del encabezado<\u002Fspan>\n                  <input value=\"{{ lema }}\" sc-camel-on-change=\"{{ setLema }}\" placeholder=\"Ej. Copa Aniversario 2026\" style=\"width:100%; border:0; background:var(--ios-fill); padding:12px; font-family:var(--font-body); font-size:14px; color:var(--color-text); border-radius:12px\">\n                <\u002Flabel>\n                <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:8px\">Va junto al logo, arriba a la izquierda en escritorio y centrado en el celular.<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ restaurarLema }}\" style=\"border-radius:12px; display:inline-flex; align-items:center; gap:8px; margin-top:14px; background:transparent; border:1px solid var(--ios-sep); padding:{{ padSec }}; font-size:11px; font-weight:700; letter-spacing:0.02em; text-transform:none; white-space:nowrap\" style-hover=\"background:var(--color-surface)\" style-active=\"background:var(--color-neutral-200); transform:translateY(1px)\">{{ icoUndo }}Restaurar<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:1px solid var(--ios-sep); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700)\">Avisos para el público<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Aparecen arriba de todo en el link público, en todas las categorías. Úsalos para lluvia, reprogramaciones o cambio de cancha.<\u002Fdiv>\n              <textarea value=\"{{ avisoDraft }}\" sc-camel-on-change=\"{{ setAvisoDraft }}\" rows=\"2\" placeholder=\"Ej. Por lluvia, la fecha 4 pasa al domingo 18\" style=\"width:100%; margin-top:12px; border:0; background:var(--ios-fill); padding:10px 12px; font-family:var(--font-body); font-size:14px; color:var(--color-text); border-radius:12px; resize:vertical\"><\u002Ftextarea>\n              <button sc-camel-on-click=\"{{ publicarAviso }}\" style=\"border-radius:12px; display:inline-flex; align-items:center; gap:8px; margin-top:10px; border:0; background:var(--color-accent); color:var(--color-neutral-100); padding:10px 14px; font-size:12px; font-weight:700; letter-spacing:0.02em; text-transform:none; text-align:left\" style-hover=\"background:var(--color-accent-600)\" style-active=\"background:var(--color-accent-700)\">Publicar aviso<\u002Fbutton>\n              <div style=\"display:grid; gap:0; margin-top:14px\">\n                <sc-for list=\"{{ avisosAdmin }}\" as=\"a\" hint-placeholder-count=\"0\">\n                  <div style=\"display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--color-neutral-300)\">\n                    <div>\n                      <div style=\"font-size:14px; text-wrap:pretty\">{{ a.texto }}<\u002Fdiv>\n                      <div style=\"font-size:11px; color:var(--color-neutral-700)\">{{ a.fecha }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ a.quitar }}\" style=\"border-radius:12px; border:0; background:var(--ios-fill); padding:6px 10px; font-size:11px; font-weight:700; letter-spacing:0.02em; text-transform:none\" style-hover=\"background:var(--color-accent-100)\">Quitar<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:1px solid var(--ios-sep); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700)\">Cómo se juega cada domingo<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Con esto se arma el fixture de cada categoría: los horarios salen de la hora de inicio, la duración del partido y los segundos de cambio entre partidos. Si una fecha no alcanza para todos los partidos, el resto pasa al domingo siguiente.<\u002Fdiv>\n              <label style=\"display:grid; grid-template-columns:minmax(0,1fr) 180px; gap:12px; align-items:center; margin-top:14px; padding:14px; border:2px solid var(--color-accent); background:var(--color-neutral-100)\">\n                <span style=\"display:flex; flex-direction:column; gap:2px\"><span style=\"font-size:14px; font-weight:700\">Primer domingo del campeonato<\u002Fspan><span style=\"font-size:12px; color:var(--color-neutral-700); text-wrap:pretty\">Cambia la fecha de inicio de todas las categorías. Los partidos se corren las mismas semanas y se respeta el orden del fixture.<\u002Fspan><\u002Fspan>\n                <span style=\"display:flex; flex-direction:column; gap:8px\">\n                  <input value=\"{{ inicioGlobal }}\" sc-camel-on-change=\"{{ setInicioGlobal }}\" type=\"date\" style=\"width:100%; border:0; background:var(--ios-fill); padding:10px; font-family:var(--font-body); font-size:14px; font-weight:700; color:var(--color-text)\">\n                  <button sc-camel-on-click=\"{{ aplicarInicioGlobal }}\" style=\"border:0; background:var(--color-accent); color:var(--color-neutral-100); padding:9px 12px; font-size:12px; font-weight:700; text-align:left\" style-hover=\"background:var(--color-accent-600)\" style-active=\"background:var(--color-accent-700)\">Aplicar al fixture<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Flabel>\n              <sc-for list=\"{{ cfgCats }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"border-top:1px solid var(--color-neutral-300); padding:16px 0\">\n                  <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:10px\">\n                    <span style=\"font-size:14px; font-weight:700\">{{ c.nombre }}<\u002Fspan>\n                    <span style=\"font-size:11px; color:var(--color-neutral-700)\">{{ c.equipos }} equipos<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(116px, 1fr)); gap:10px; margin-top:10px; align-items:end\">\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.02em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Partidos por equipo cada domingo<\u002Fspan>\n                      <input value=\"{{ c.porDomingo }}\" sc-camel-on-change=\"{{ c.setPorDomingo }}\" type=\"number\" min=\"1\" max=\"4\" style=\"width:100%; border:0; background:var(--ios-fill); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:12px\">\n                    <\u002Flabel>\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.02em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Hora de inicio<\u002Fspan>\n                      <input value=\"{{ c.horaInicio }}\" sc-camel-on-change=\"{{ c.setHora }}\" type=\"time\" style=\"width:100%; border:0; background:var(--ios-fill); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:12px\">\n                    <\u002Flabel>\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.02em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Canchas<\u002Fspan>\n                      <input value=\"{{ c.canchas }}\" sc-camel-on-change=\"{{ c.setCanchas }}\" type=\"number\" min=\"1\" max=\"2\" style=\"width:100%; border:0; background:var(--ios-fill); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:12px\">\n                    <\u002Flabel>\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.02em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Descanso entre partidos (seg)<\u002Fspan>\n                      <input value=\"{{ c.descanso }}\" sc-camel-on-change=\"{{ c.setDescanso }}\" type=\"number\" min=\"0\" max=\"900\" step=\"30\" style=\"width:100%; border:0; background:var(--ios-fill); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:12px\">\n                    <\u002Flabel>\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.02em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Primer domingo<\u002Fspan>\n                      <input value=\"{{ c.primerDomingo }}\" sc-camel-on-change=\"{{ c.setPrimer }}\" type=\"date\" style=\"width:100%; border:0; background:var(--ios-fill); padding:10px; font-family:var(--font-body); font-size:14px; font-weight:700; color:var(--color-text); border-radius:12px\">\n                    <\u002Flabel>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:14px; padding:14px; border-radius:16px; background:rgba(255,255,255,0.68); box-shadow:0 8px 24px rgba(20,40,30,0.06)\">\n                    <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap\">\n                      <span style=\"font-size:14px; font-weight:700\">Horario de cada cancha<\u002Fspan>\n                      <span style=\"font-size:12px; color:var(--color-neutral-700)\">{{ c.resumenSlots }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:4px; max-width:60ch; text-wrap:pretty\">Al generar el fixture, los partidos se reparten en estos horarios. Si una cancha solo está libre en la tarde, ponle ese horario.<\u002Fdiv>\n                    <div style=\"display:grid; grid-template-columns:minmax(0,1.4fr) 104px 104px auto; gap:8px; margin-top:10px; font-size:11px; font-weight:700; color:var(--color-neutral-700)\"><div>Cancha<\u002Fdiv><div>Desde<\u002Fdiv><div>Hasta<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n                    <sc-for list=\"{{ c.horarios }}\" as=\"hc\" hint-placeholder-count=\"2\">\n                      <div style=\"display:grid; grid-template-columns:minmax(0,1.4fr) 104px 104px auto; gap:8px; margin-top:6px; align-items:center\">\n                        <input value=\"{{ hc.nombre }}\" sc-camel-on-change=\"{{ hc.setNombre }}\" style=\"width:100%; border:0; background:var(--ios-fill); border-radius:10px; padding:8px 10px; font-family:var(--font-body); font-size:14px; font-weight:700; color:var(--color-text)\">\n                        <input type=\"time\" value=\"{{ hc.inicio }}\" sc-camel-on-change=\"{{ hc.setInicio }}\" style=\"width:100%; border:0; background:var(--ios-fill); border-radius:10px; padding:8px 10px; font-family:var(--font-body); font-size:14px; font-weight:700; color:var(--color-text)\">\n                        <input type=\"time\" value=\"{{ hc.fin }}\" sc-camel-on-change=\"{{ hc.setFin }}\" style=\"width:100%; border:0; background:var(--ios-fill); border-radius:10px; padding:8px 10px; font-family:var(--font-body); font-size:14px; font-weight:700; color:var(--color-text)\">\n                        <button sc-camel-on-click=\"{{ hc.quitar }}\" title=\"Quitar cancha\" style=\"border-radius:10px; display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border:0; background:#fde8e6; color:#b42318\" style-active=\"transform:scale(0.95)\">{{ icoQuitar }}<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <div style=\"display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-top:12px\">\n                      <button sc-camel-on-click=\"{{ c.agregarCancha }}\" style=\"border-radius:12px; display:inline-flex; align-items:center; gap:8px; border:0; background:var(--ios-fill); color:var(--color-text); padding:9px 14px; font-size:13px; font-weight:700; text-align:left; white-space:nowrap\" style-active=\"transform:translateY(1px)\">{{ icoPlus }}Agregar cancha<\u002Fbutton>\n                      <label style=\"display:flex; flex-direction:column; gap:4px; font-size:11px; font-weight:700; color:var(--color-neutral-700)\">Cada partido dura (min)<input type=\"number\" min=\"10\" max=\"180\" step=\"1\" value=\"{{ c.turno }}\" sc-camel-on-change=\"{{ c.setTurno }}\" style=\"width:100%; border:0; background:var(--ios-fill); border-radius:10px; padding:8px 10px; font-family:var(--font-body); font-size:14px; font-weight:700; color:var(--color-text); width:120px\"><\u002Flabel>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:1px solid var(--ios-sep); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700)\">Plantilla y costos por categoría<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Define cuánto cobra cada categoría al empezar el campeonato y cuántos jugadores puede inscribir un equipo. La inscripción se cobra una vez por equipo; la cuota se cobra por partido jugado.<\u002Fdiv>\n              <sc-for list=\"{{ cfgCats }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"border-top:1px solid var(--color-neutral-300); padding:16px 0\">\n                  <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:10px\">\n                    <span style=\"font-size:14px; font-weight:700\">{{ c.nombre }}<\u002Fspan>\n                    <span style=\"font-size:11px; color:var(--color-neutral-700)\">{{ c.equipos }} equipos<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-top:10px; align-items:end\">\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.02em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Inscripción (S/)<\u002Fspan>\n                      <input value=\"{{ c.inscripcion }}\" sc-camel-on-change=\"{{ c.setInscripcion }}\" type=\"number\" min=\"0\" max=\"9999\" step=\"10\" style=\"width:100%; border:0; background:var(--ios-fill); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:12px\">\n                    <\u002Flabel>\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.02em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Arbitraje por partido (S/) · recomendado 70<\u002Fspan>\n                      <input value=\"{{ c.cuota }}\" sc-camel-on-change=\"{{ c.setCuota }}\" type=\"number\" min=\"0\" max=\"9999\" step=\"5\" style=\"width:100%; border:0; background:var(--ios-fill); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:12px\">\n                    <\u002Flabel>\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.02em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Máximo de jugadores<\u002Fspan>\n                      <input value=\"{{ c.tope }}\" sc-camel-on-change=\"{{ c.setTope }}\" type=\"number\" min=\"5\" max=\"30\" style=\"width:100%; border:0; background:var(--ios-fill); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:12px\">\n                    <\u002Flabel>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:8px\">{{ c.resumenCosto }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:1px solid var(--ios-sep); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700)\">Duración del partido<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Al cumplirse este tiempo, el sistema avisa que el partido terminó, pero el cronómetro sigue corriendo hasta que la mesa cierre el partido: así queda registrado cuánto se pasó.<\u002Fdiv>\n              <label style=\"display:inline-flex; align-items:center; gap:12px; margin-top:14px\">\n                <input value=\"{{ limite }}\" sc-camel-on-change=\"{{ setLimite }}\" type=\"number\" min=\"1\" max=\"180\" style=\"width:110px; border:0; background:var(--ios-fill); padding:11px; font-family:var(--font-body); font-size:16px; font-weight:700; color:var(--color-text); border-radius:12px\">\n                <span style=\"font-size:11px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700)\">minutos por partido<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:1px solid var(--ios-sep); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700)\">Delegados de mesa<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Estos son los nombres que aparecen al abrir un partido. El que se elija queda pegado al resultado y al historial.<\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-top:14px\">\n                <sc-for list=\"{{ mesasAjustes }}\" as=\"m\" hint-placeholder-count=\"4\">\n                  <label style=\"display:block\">\n                    <span style=\"display:block; font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px\">{{ m.num }}<\u002Fspan>\n                    <input value=\"{{ m.nombre }}\" sc-camel-on-change=\"{{ m.set }}\" placeholder=\"Nombre y apellido\" style=\"width:100%; border:0; background:var(--ios-fill); padding:11px; font-family:var(--font-body); font-size:14px; color:var(--color-text); border-radius:12px\">\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:1px solid var(--ios-sep); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-accent-700)\">Empezar de cero<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Borra los equipos de prueba, sus jugadores, el fixture, los resultados y los pagos de las cuatro categorías. Queda el sistema vacío para cargar tu campeonato. El aviso te deja deshacerlo por 10 segundos.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ vaciarTodo }}\" style=\"border-radius:12px; display:inline-flex; align-items:center; gap:8px; margin-top:12px; background:transparent; border:2px solid var(--color-accent-700); color:var(--color-accent-700); padding:{{ padSec }}; font-size:11px; font-weight:700; letter-spacing:0.02em; text-transform:none\" style-hover=\"background:var(--color-accent-200)\" style-active=\"background:var(--color-accent-300); transform:translateY(1px)\">Vaciar todo el sistema<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:1px solid var(--ios-sep); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700)\">Simulación<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Reemplaza los datos actuales por un campeonato de prueba: 12 equipos en Libre, 8 en Master y 6 en Damas, con fixture, jugadores y fechas ya jugadas. El aviso te deja deshacerlo por 10 segundos.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ cargarSimulacion }}\" style=\"border-radius:12px; display:inline-flex; align-items:center; gap:8px; margin-top:12px; border:0; background:var(--color-accent); color:var(--color-neutral-100); padding:{{ padSec }}; font-size:11px; font-weight:700; letter-spacing:0.02em; text-transform:none\" style-hover=\"background:var(--color-accent-600)\" style-active=\"background:var(--color-accent-700); transform:translateY(1px)\">Cargar simulación<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:1px solid var(--ios-sep); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700)\">Acceso<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Esta sección y la corrección de resultados piden un PIN de 4 dígitos. Queda desbloqueado hasta que lo bloquees o cierres la aplicación.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ bloquear }}\" style=\"border-radius:12px; display:inline-flex; align-items:center; gap:8px; margin-top:12px; background:transparent; border:1px solid var(--ios-sep); padding:{{ padSec }}; font-size:11px; font-weight:700; letter-spacing:0.02em; text-transform:none\" style-hover=\"background:var(--color-surface)\" style-active=\"background:var(--color-neutral-200); transform:translateY(1px)\">Bloquear ahora<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:1px solid var(--ios-sep); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700)\">Así se ve el encabezado<\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:12px; margin-top:12px; background:rgba(255,255,255,0.68); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%); box-shadow:0 1px 0 rgba(255,255,255,0.7) inset, 0 8px 24px rgba(20,40,30,0.06); padding:14px; border-radius:18px\">\n                <span style=\"width:38px; height:38px; flex:0 0 auto; display:block\">\n                  <label title=\"Subir logo de la liga\" style=\"position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; cursor:{{ logoCursor }}\">\n            <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ subirLogoLiga }}\" disabled=\"{{ logoBloq }}\" style=\"position:absolute; width:1px; height:1px; opacity:0; pointer-events:none\">\n            <sc-if value=\"{{ logoLigaHay }}\" hint-placeholder-val=\"{{ false }}\"><span role=\"img\" aria-label=\"Logo\" style=\"display:block; width:100%; height:100%; background:center / contain no-repeat; background-image:{{ logoLigaBg }}\"><\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ logoLigaNo }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:9px; font-weight:700; color:var(--color-neutral-700); border:1px dashed var(--ios-sep); width:100%; height:100%; display:flex; align-items:center; justify-content:center\">Logo<\u002Fspan><\u002Fsc-if>\n          <\u002Flabel>\n                <\u002Fspan>\n                <span style=\"font-size:11px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700)\">{{ lema }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ esPublico }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:{{ animPantalla }}; max-width:760px\">\n            <div style=\"font-size:10px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; color:var(--color-neutral-700)\">Resultados y posiciones en vivo<\u002F
