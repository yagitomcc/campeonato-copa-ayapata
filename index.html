2Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ esAjustes }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:{{ animPantalla }}; max-width:620px\">\n            <h1 style=\"margin:0; font-size:28px; font-weight:800; letter-spacing:-0.02em\">Ajustes de la liga<\u002Fh1>\n            <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:4px\">El logo y el texto del encabezado aparecen en todas las pantallas y en la vista pública.<\u002Fdiv>\n            <div style=\"border-bottom:2px solid var(--color-text); margin-top:12px\"><\u002Fdiv>\n\n            <div style=\"display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; margin-top:24px\">\n              <div>\n                <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:8px\">Logo de la liga<\u002Fdiv>\n                <div style=\"width:150px; height:150px; border:1px dashed var(--color-neutral-400)\">\n                  <image-slot id=\"logo-liga-dominical\" shape=\"rect\" fit=\"contain\" placeholder=\"Arrastra el PNG del logo\" src=\"46c03ee0-9bf9-4e42-9aa2-c431efaa0a7a\"><\u002Fimage-slot>\n                <\u002Fdiv>\n                <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:8px; max-width:150px\">PNG con fondo transparente, cuadrado.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"flex:1 1 260px; min-width:240px\">\n                <label style=\"display:block\">\n                  <span style=\"display:block; font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:6px\">Texto del encabezado<\u002Fspan>\n                  <input value=\"{{ lema }}\" sc-camel-on-change=\"{{ setLema }}\" placeholder=\"Ej. Copa Aniversario 2026\" style=\"width:100%; border:2px solid var(--color-text); background:var(--color-neutral-100); padding:12px; font-family:var(--font-body); font-size:14px; color:var(--color-text); border-radius:0\">\n                <\u002Flabel>\n                <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:8px\">Va junto al logo, arriba a la izquierda en escritorio y centrado en el celular.<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ restaurarLema }}\" style=\"display:inline-flex; align-items:center; gap:8px; margin-top:14px; background:transparent; border:2px solid var(--color-text); padding:{{ padSec }}; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase\" style-hover=\"background:var(--color-surface)\" style-active=\"background:var(--color-neutral-200); transform:translateY(1px)\">{{ icoUndo }}Restaurar<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:2px solid var(--color-text); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700)\">Cómo se juega cada domingo<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Con esto se arma el fixture de cada categoría: los horarios salen de la hora de inicio, la duración del partido y los segundos de cambio entre partidos. Si una fecha no alcanza para todos los partidos, el resto pasa al domingo siguiente.<\u002Fdiv>\n              <sc-for list=\"{{ cfgCats }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"border-top:1px solid var(--color-neutral-300); padding:16px 0\">\n                  <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:10px\">\n                    <span style=\"font-size:14px; font-weight:700\">{{ c.nombre }}<\u002Fspan>\n                    <span style=\"font-size:11px; color:var(--color-neutral-700)\">{{ c.equipos }} equipos<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(116px, 1fr)); gap:10px; margin-top:10px; align-items:end\">\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.12em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Partidos por domingo<\u002Fspan>\n                      <input value=\"{{ c.porDomingo }}\" sc-camel-on-change=\"{{ c.setPorDomingo }}\" type=\"number\" min=\"1\" max=\"12\" style=\"width:100%; border:2px solid var(--color-text); background:var(--color-neutral-100); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:0\">\n                    <\u002Flabel>\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.12em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Hora de inicio<\u002Fspan>\n                      <input value=\"{{ c.horaInicio }}\" sc-camel-on-change=\"{{ c.setHora }}\" type=\"time\" style=\"width:100%; border:2px solid var(--color-text); background:var(--color-neutral-100); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:0\">\n                    <\u002Flabel>\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.12em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Canchas<\u002Fspan>\n                      <input value=\"{{ c.canchas }}\" sc-camel-on-change=\"{{ c.setCanchas }}\" type=\"number\" min=\"1\" max=\"6\" style=\"width:100%; border:2px solid var(--color-text); background:var(--color-neutral-100); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:0\">\n                    <\u002Flabel>\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.12em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Descanso entre partidos (seg)<\u002Fspan>\n                      <input value=\"{{ c.descanso }}\" sc-camel-on-change=\"{{ c.setDescanso }}\" type=\"number\" min=\"0\" max=\"900\" step=\"30\" style=\"width:100%; border:2px solid var(--color-text); background:var(--color-neutral-100); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:0\">\n                    <\u002Flabel>\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.12em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Primer domingo<\u002Fspan>\n                      <input value=\"{{ c.primerDomingo }}\" sc-camel-on-change=\"{{ c.setPrimer }}\" type=\"date\" style=\"width:100%; border:2px solid var(--color-text); background:var(--color-neutral-100); padding:10px; font-family:var(--font-body); font-size:14px; font-weight:700; color:var(--color-text); border-radius:0\">\n                    <\u002Flabel>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:2px solid var(--color-text); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700)\">Plantilla y costos por categoría<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Define cuánto cobra cada categoría al empezar el campeonato y cuántos jugadores puede inscribir un equipo. La inscripción se cobra una vez por equipo; la cuota se cobra por partido jugado.<\u002Fdiv>\n              <sc-for list=\"{{ cfgCats }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"border-top:1px solid var(--color-neutral-300); padding:16px 0\">\n                  <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:10px\">\n                    <span style=\"font-size:14px; font-weight:700\">{{ c.nombre }}<\u002Fspan>\n                    <span style=\"font-size:11px; color:var(--color-neutral-700)\">{{ c.equipos }} equipos<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-top:10px; align-items:end\">\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.12em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Inscripción (S/)<\u002Fspan>\n                      <input value=\"{{ c.inscripcion }}\" sc-camel-on-change=\"{{ c.setInscripcion }}\" type=\"number\" min=\"0\" max=\"9999\" step=\"10\" style=\"width:100%; border:2px solid var(--color-text); background:var(--color-neutral-100); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:0\">\n                    <\u002Flabel>\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.12em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Cuota por partido (S/)<\u002Fspan>\n                      <input value=\"{{ c.cuota }}\" sc-camel-on-change=\"{{ c.setCuota }}\" type=\"number\" min=\"0\" max=\"9999\" step=\"5\" style=\"width:100%; border:2px solid var(--color-text); background:var(--color-neutral-100); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:0\">\n                    <\u002Flabel>\n                    <label style=\"display:block\">\n                      <span style=\"display:block; font-size:9px; font-weight:700; letter-spacing:0.12em; line-height:1.35; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px; min-height:2.7em\">Máximo de jugadores<\u002Fspan>\n                      <input value=\"{{ c.tope }}\" sc-camel-on-change=\"{{ c.setTope }}\" type=\"number\" min=\"5\" max=\"30\" style=\"width:100%; border:2px solid var(--color-text); background:var(--color-neutral-100); padding:10px; font-family:var(--font-body); font-size:15px; font-weight:700; color:var(--color-text); border-radius:0\">\n                    <\u002Flabel>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:8px\">{{ c.resumenCosto }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:2px solid var(--color-text); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700)\">Duración del partido<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Al cumplirse este tiempo, la planilla avisa que el partido terminó, pero el cronómetro sigue corriendo hasta que la mesa cierre la planilla: así queda registrado cuánto se pasó.<\u002Fdiv>\n              <label style=\"display:inline-flex; align-items:center; gap:12px; margin-top:14px\">\n                <input value=\"{{ limite }}\" sc-camel-on-change=\"{{ setLimite }}\" type=\"number\" min=\"1\" max=\"180\" style=\"width:110px; border:2px solid var(--color-text); background:var(--color-neutral-100); padding:11px; font-family:var(--font-body); font-size:16px; font-weight:700; color:var(--color-text); border-radius:0\">\n                <span style=\"font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700)\">minutos por partido<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:2px solid var(--color-text); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700)\">Delegados de mesa<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Estos son los nombres que aparecen al abrir una planilla. El que se elija queda pegado al resultado y al historial.<\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-top:14px\">\n                <sc-for list=\"{{ mesasAjustes }}\" as=\"m\" hint-placeholder-count=\"4\">\n                  <label style=\"display:block\">\n                    <span style=\"display:block; font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700); margin-bottom:5px\">{{ m.num }}<\u002Fspan>\n                    <input value=\"{{ m.nombre }}\" sc-camel-on-change=\"{{ m.set }}\" placeholder=\"Nombre y apellido\" style=\"width:100%; border:2px solid var(--color-text); background:var(--color-neutral-100); padding:11px; font-family:var(--font-body); font-size:14px; color:var(--color-text); border-radius:0\">\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:2px solid var(--color-text); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-accent-700)\">Empezar de cero<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Borra los equipos de prueba, sus jugadores, el fixture, los resultados y los pagos de las cuatro categorías. Queda el sistema vacío para cargar tu campeonato. El aviso te deja deshacerlo por 10 segundos.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ vaciarTodo }}\" style=\"display:inline-flex; align-items:center; gap:8px; margin-top:12px; background:transparent; border:2px solid var(--color-accent-700); color:var(--color-accent-700); padding:{{ padSec }}; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase\" style-hover=\"background:var(--color-accent-200)\" style-active=\"background:var(--color-accent-300); transform:translateY(1px)\">Vaciar todo el sistema<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:2px solid var(--color-text); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700)\">Acceso<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:52ch; text-wrap:pretty\">Esta sección y la corrección de resultados piden un PIN de 4 dígitos. Queda desbloqueado hasta que lo bloquees o cierres la aplicación.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ bloquear }}\" style=\"display:inline-flex; align-items:center; gap:8px; margin-top:12px; background:transparent; border:2px solid var(--color-text); padding:{{ padSec }}; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase\" style-hover=\"background:var(--color-surface)\" style-active=\"background:var(--color-neutral-200); transform:translateY(1px)\">Bloquear ahora<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:30px; border-top:2px solid var(--color-text); padding-top:16px\">\n              <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700)\">Así se ve el encabezado<\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:12px; margin-top:12px; background:var(--color-surface); padding:14px\">\n                <span style=\"width:38px; height:38px; flex:0 0 auto; display:block\">\n                  <image-slot id=\"logo-liga-dominical\" shape=\"rect\" fit=\"contain\" placeholder=\"Logo\" style=\"--slot-bg:transparent\" src=\"46c03ee0-9bf9-4e42-9aa2-c431efaa0a7a\"><\u002Fimage-slot>\n                <\u002Fspan>\n                <span style=\"font-size:11px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--color-neutral-700)\">{{ lema }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ esPublico }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:{{ animPantalla }}; max-width:760px\">\n            <div style=\"font-size:10px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--color-neutral-700)\">Vista pública · sin sesión<\u002Fdiv>\n            <h1 style=\"margin:6px 0 0; font-size:40px; font-weight:800; letter-spacing:-0.035em; line-height:1.02\">{{ catNombre }}<\u002Fh1>\n            <div style=\"font-size:14px; color:var(--color-neutral-700); margin-top:6px\">{{ catHorario }}<\u002Fdiv>\n            <div style=\"border-bottom:2px solid var(--color-text); margin-top:16px\"><\u002Fdiv>\n\n            <sc-if value=\"{{ hayEnVivo }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:var(--color-accent); color:var(--color-neutral-100); padding:26px 22px 28px; margin-top:20px\">\n                <div style=\"display:flex; align-items:center; gap:9px; font-size:11px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--color-text)\">\n                  <span style=\"width:9px; height:9px; background:var(--color-text); display:block; animation:pulso 1.2s ease-in-out infinite\"><\u002Fspan>En vivo · {{ envivo.cancha }}\n                <\u002Fdiv>\n                <div style=\"font-size:64px; font-weight:800; letter-spacing:-0.05em; line-height:0.9; margin-top:16px; font-variant-numeric:tabular-nums; animation:{{ animPulso }}\">{{ envivo.gl }} – {{ envivo.gv }}<\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:baseline; margin-top:14px\">\n                  <div style=\"font-size:20px; font-weight:700; letter-spacing:-0.01em\">{{ envivo.local }}<\u002Fdiv>\n                  <div style=\"font-size:20px; font-weight:800; font-variant-numeric:tabular-nums\">{{ envivo.gl }}<\u002Fdiv>\n                  <div style=\"font-size:20px; font-weight:700; letter-spacing:-0.01em\">{{ envivo.visita }}<\u002Fdiv>\n                  <div style=\"font-size:20px; font-weight:800; font-variant-numeric:tabular-nums\">{{ envivo.gv }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:13px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-text); margin-top:16px; font-variant-numeric:tabular-nums\">{{ envivo.reloj }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <h2 style=\"margin:24px 0 0; font-size:13px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase\">Próxima fecha<\u002Fh2>\n            <sc-for list=\"{{ proximos }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid; grid-template-columns:66px minmax(0,1fr) 20px minmax(0,1fr) 90px; gap:10px; padding:14px 0; border-bottom:1px solid var(--color-neutral-300); align-items:center\">\n                <div style=\"font-size:14px; font-weight:800; font-variant-numeric:tabular-nums\">{{ m.hora }}<\u002Fdiv>\n                <div style=\"font-size:15px; text-align:right\">{{ m.local }}<\u002Fdiv>\n                <div style=\"text-align:center; font-size:12px; color:var(--color-neutral-700)\">vs<\u002Fdiv>\n                <div style=\"font-size:15px\">{{ m.visita }}<\u002Fdiv>\n                <div style=\"font-size:12px; color:var(--color-neutral-700); text-align:right\">{{ m.cancha }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <h2 style=\"margin:30px 0 0; font-size:13px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase\">Posiciones<\u002Fh2>\n            <sc-for list=\"{{ tabla }}\" as=\"t\" hint-placeholder-count=\"8\">\n              <div style=\"display:grid; grid-template-columns:30px minmax(0,1fr) 46px 46px; gap:10px; padding:11px 0; border-bottom:1px solid var(--color-neutral-300); align-items:center; font-variant-numeric:tabular-nums\">\n                <div style=\"font-size:14px; font-weight:800; color:{{ t.posFg }}\">{{ t.pos }}<\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:12px\">\n                  <span style=\"width:38px; height:38px; flex:0 0 38px; background:var(--color-surface); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:var(--color-neutral-700)\">{{ t.ini }}<\u002Fspan>\n                  <span style=\"font-size:15px; font-weight:600\">{{ t.equipo }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"text-align:right; font-size:13px; color:var(--color-neutral-700)\">{{ t.pj }} PJ<\u002Fdiv>\n                <div style=\"text-align:right; font-size:16px; font-weight:800\">{{ t.pts }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ statsFutbol }}\" hint-placeholder-val=\"{{ true }}\">\n            <h2 style=\"margin:30px 0 0; font-size:13px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase\">Goleadores<\u002Fh2>\n            <sc-for list=\"{{ goleadoresTop }}\" as=\"g\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 44px; gap:10px; padding:11px 0; border-bottom:1px solid var(--color-neutral-300); align-items:center\">\n                <div>\n                  <div style=\"font-size:15px; font-weight:600\">{{ g.nombre }}<\u002Fdiv>\n                  <div style=\"font-size:12px; color:var(--color-neutral-700)\">{{ g.equipo }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align:right; font-size:18px; font-weight:800\">{{ g.goles }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ esMovil }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:44px; padding-top:14px; border-top:1px solid var(--color-neutral-300); display:flex; flex-direction:column; align-items:center; gap:10px\">\n            <span style=\"font-size:8px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; padding:5px 8px; background:{{ nubeBg }}; color:{{ nubeFg }}\">{{ nubeTexto }}<\u002Fspan>\n            <span style=\"font-size:8px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600)\">{{ credito }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ dlgEquipo }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:20; background:color-mix(in srgb, var(--color-text) 50%, transpar () => this.setState({ vivo: m.id, seg: 0, corre: false, eventos: [], fase: 'control', presentes: {} })\n          })),\n          vivo: mv ? {\n            local: mv.local, visita: mv.visita, gl, gv,\n            iniLocal: this.ini(mv.local), iniVisita: this.ini(mv.visita),\n            reloj: voley ? 'Set ' + Math.min(5, gl + gv + 1) : String(Math.floor(s.seg / 60)).padStart(2, '0') + ':' + String(s.seg % 60).padStart(2, '0'),\n            cancha: mv.cancha, fecha: mv.fecha, jornada: mv.jornada, mesa: s.mesa || 'sin asignar'\n          } : {},\n          relojFg: s.seg >= (s.limite || 20) * 60 ? 'var(--color-accent-700)' : 'var(--color-text)',\n          limiteTexto: 'de ' + (s.limite || 20) + ' min reglamentarios',\n          relojBg: s.seg >= (s.limite || 20) * 60 ? 'var(--color-accent)' : 'var(--color-text)',\n          colsCab: movil ? 'minmax(0,1fr)' : 'minmax(0,1fr) auto minmax(0,1fr)',\n          relojMin: movil ? '104px' : '132px',\n          relojPad: movil ? '8px 10px 0' : '10px 14px 0',\n          relojSize: movil ? '21px' : '26px',\n          escudoPx: movil ? '36px' : '52px',\n          escudoFs: movil ? '12px' : '17px',\n          justVisita: movil ? 'flex-start' : 'flex-end',\n          alignVisita: movil ? 'left' : 'right',\n          relojInk: 'var(--color-neutral-100)',\n          relojBarra: Math.min(100, Math.round((s.seg / ((s.limite || 20) * 60)) * 100)) + '%',\n          relojBarraBg: s.seg >= (s.limite || 20) * 60 ? 'var(--color-text)' : 'var(--color-accent)',\n          animPunto: s.corre ? 'pulso 1.2s ease-in-out infinite' : 'none',\n          tiempoCumplido: !voley && s.seg >= (s.limite || 20) * 60,\n          extraTexto: 'Tiempo cumplido hace ' + Math.floor((s.seg - (s.limite || 20) * 60) / 60) + ' min · el cronómetro sigue para que quede registrado',\n          animCerrar: !voley && s.seg >= (s.limite || 20) * 60 ? 'pulso 1.4s ease-in-out infinite' : 'none',\n          corre: s.corre,\n          noCorre: !s.corre,\n          mostrarInicio: !voley && !s.corre,\n          mostrarPausa: !voley && s.corre,\n          arrancar: () => this.setState({ corre: true }),\n          parar: () => this.setState({ corre: false }),\n          jugLocal: mv ? fila(mv.local) : [],\n          jugVisita: mv ? fila(mv.visita) : [],\n          eventos: evs.slice().reverse().map((e, i) => ({\n            min: e.tipo === 'set' ? 'Set' : e.min + \"'\",\n            texto: e.tipo === 'set' ? 'Set ganado'\n              : (e.tipo === 'gol' ? 'Gol' : e.tipo === 'amarilla' ? 'Amarilla' : 'Roja') + ' · ' + e.jugador,\n            equipo: e.equipo,\n            fg: e.tipo === 'gol' ? 'var(--color-text)' : 'var(--color-accent-700)',\n            borrar: () => this.setState(st => ({ eventos: st.eventos.filter((x, k) => k !== st.eventos.length - 1 - i) }))\n          })),\n          sinEventos: evs.length === 0,\n          cerrarPlanilla: () => {\n            if (!mv) return;\n            const id = mv.id;\n            const goles = voley ? [] : evs.filter(e => e.tipo === 'gol').map(e => ({ equipo: e.equipo, jugador: e.jugador, min: e.min }));\n            const tarjetas = voley ? [] : evs.filter(e => e.tipo === 'amarilla' || e.tipo === 'roja').map(e => ({ equipo: e.equipo, jugador: e.jugador, tipo: e.tipo }));\n            this.setState(st => ({\n              matches: st.matches.map(m => m.id === id ? { ...m, estado: 'por-confirmar', gl, gv, goles, tarjetas, mesa: st.mesa } : m),\n              vivo: null, corre: false, seg: 0, eventos: [], fase: 'control', presentes: {}, mesa: null, screen: 'resultados',\n              auditoria: [{ texto: 'Planilla cerrada ' + mv.local + ' ' + gl + '–' + gv + ' ' + mv.visita + ' (J' + mv.jornada + ')', quien: st.mesa || 'Mesa' }, ...st.auditoria]\n            }));\n            this.toastMsg('Planilla cerrada ' + gl + '–' + gv + (voley ? ' en sets' : '') + '. Queda por confirmar por el organizador.');\n          },\n          salirPlanilla: () => this.setState({ vivo: null, corre: false, seg: 0, eventos: [], fase: 'control', presentes: {} })\n        };\n      })(),\n      hayToast: !!s.toast, toast: s.toast,\n      hayUndo: !!s.undo,\n      deshacer: () => { const u = s.undo; if (u) u(); },\n      dlgMinuto: s.dlg === 'minuto',\n      golMin: s.golMin,\n      golJug: s.golJug,\n      minMas: () => this.setState(st => ({ golMin: st.golMin + 1 })),\n      minMenos: () => this.setState(st => ({ golMin: Math.max(0, st.golMin - 1) })),\n      minMas5: () => this.setState(st => ({ golMin: st.golMin + 5 })),\n      minMenos5: () => this.setState(st => ({ golMin: Math.max(0, st.golMin - 5) })),\n      guardarGolMin: () => {\n        this.setState(st => ({\n          eventos: [...st.eventos, { tipo: 'gol', equipo: st.golEq, jugador: st.golJug, min: st.golMin }],\n          dlg: null\n        }));\n        this.toastMsg('Gol de ' + s.golJug + \" al \" + s.golMin + \"'.\");\n      },\n      envivo: (() => {\n        const mv = ms.find(x => x.id === s.vivo);\n        if (!mv || s.fase !== 'juego') return null;\n        const tp = voley ? 'set' : 'gol';\n        return {\n          local: mv.local, visita: mv.visita, cancha: mv.cancha,\n          gl: s.eventos.filter(e => e.tipo === tp && e.equipo === mv.local).length,\n          gv: s.eventos.filter(e => e.tipo === tp && e.equipo === mv.visita).length,\n          reloj: voley ? 'En juego' : String(Math.floor(s.seg / 60)).padStart(2, '0') + ':' + String(s.seg % 60).padStart(2, '0')\n        };\n      })(),\n      hayEnVivo: !!s.vivo && s.fase === 'juego'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
