  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);  sc-camel-on-click=\"{{ confirmarJ }}\" style=\"border:0; background:var(--color-accent); color:var(--color-neutral-100); padding:{{ padSec }}; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; text-align:left\" style-hover=\"background:var(--color-accent-600)\" style-active=\"background:var(--color-accent-700); transform:translateY(1px)\">Confirmar domingo<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ aplazarJ }}\" style=\"background:transparent; border:2px solid var(--color-text); padding:{{ padSec }}; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; text-align:left\" style-hover=\"background:var(--color-surface)\" style-active=\"background:var(--color-neutral-200); transform:translateY(1px)\">Aplazar una semana<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ reabrirJ }}\" style=\"background:transparent; border:2px solid var(--color-neutral-400); color:var(--color-neutral-700); padding:{{ padSec }}; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; text-align:left\" style-hover=\"background:var(--color-surface)\" style-active=\"background:var(--color-neutral-200); transform:translateY(1px)\">Quitar marca<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"overflow-x:auto\">\n              <div style=\"min-width:600px\">\n                <sc-if value=\"{{ sinFixture }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"border-top:2px solid var(--color-text); margin-top:6px; padding:22px 0 8px\">\n                    <div style=\"font-size:18px; font-weight:800; letter-spacing:-0.02em\">Todavía no hay fixture<\u002Fdiv>\n                    <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:46ch; text-wrap:pretty\">Inscribe los equipos de esta categoría y pulsa “Generar fixture”: se arma todos contra todos respetando las canchas y los horarios del domingo.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ hayFixture }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"font-size:12px; color:var(--color-neutral-700); padding-bottom:10px\">Arrastra un partido sobre otro para intercambiar hora y cancha. Si llovió, arrástralo sobre otra jornada de arriba: se canjean las dos fechas completas, que es la única forma de mover un domingo sin que un equipo juegue dos veces. Las fechas con resultados publicados no se mueven.<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:grid; grid-template-columns:70px minmax(0,1fr) 80px minmax(0,1fr) 100px 110px; gap:10px; padding:10px 0; border-bottom:2px solid var(--color-text); font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-neutral-700)\">\n                  <div>Hora<\u002Fdiv><div>Local<\u002Fdiv><div style=\"text-align:center\">Marcador<\u002Fdiv><div>Visita<\u002Fdiv><div>Cancha<\u002Fdiv><div>Estado<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ partidos }}\" as=\"m\" hint-placeholder-count=\"4\">\n                  <div draggable=\"{{ m.movible }}\" sc-camel-on-drag-start=\"{{ m.tomar }}\" sc-camel-on-drag-over=\"{{ m.sobre }}\" sc-camel-on-drop=\"{{ m.soltar }}\" sc-camel-on-drag-end=\"{{ m.soltarFuera }}\" style=\"display:grid; grid-template-columns:70px minmax(0,1fr) 80px minmax(0,1fr) 100px 110px; gap:10px; padding:14px 0; border-bottom:1px solid var(--color-neutral-300); align-items:center; background:{{ m.bgFila }}; cursor:{{ m.cursor }}\">\n                    <div style=\"font-size:14px; font-weight:700; font-variant-numeric:tabular-nums\">{{ m.hora }}<\u002Fdiv>\n                    <div style=\"font-size:14px; font-weight:{{ m.wl }}\">{{ m.local }}<\u002Fdiv>\n                    <div style=\"text-align:center; font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; color:{{ m.scoreFg }}\">{{ m.score }}<\u002Fdiv>\n                    <div style=\"font-size:14px; font-weight:{{ m.wv }}\">{{ m.visita }}<\u002Fdiv>\n                    <div>\n                      <div style=\"font-size:12px; color:var(--color-neutral-700)\">{{ m.cancha }}<\u002Fdiv>\n                      <div style=\"font-size:11px; color:var(--color-neutral-700)\">{{ m.mesa }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div><span style=\"font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; padding:3px 7px; background:{{ m.tagBg }}; color:{{ m.tagFg }}\">{{ m.tag }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ esResultados }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:{{ animPantalla }}\">\n            <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap\">\n              <div>\n                <h1 style=\"margin:0; font-size:28px; font-weight:800; letter-spacing:-0.02em\">Resultados<\u002Fh1>\n                <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:4px\">Los delegados cargan, tú confirmas<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ abrirResultado }}\" style=\"border:0; background:var(--color-accent); color:var(--color-neutral-100); padding:{{ padPri }}; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; text-align:left\" style-hover=\"background:var(--color-accent-600)\" style-active=\"background:var(--color-accent-700); transform:translateY(1px)\">{{ icoPlus }}Cargar resultado<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"border-bottom:2px solid var(--color-text); margin-top:12px\"><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:20px; margin-top:20px\">\n              <sc-for list=\"{{ bandeja }}\" as=\"b\" hint-placeholder-count=\"2\">\n                <div style=\"background:var(--color-surface); padding:16px\">\n                  <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-accent-700)\">Por confirmar<\u002Fdiv>\n                  <div style=\"font-size:11px; color:var(--color-neutral-700); margin-top:2px\">Jornada {{ b.jornada }} · {{ b.fecha }} · {{ b.cancha }}<\u002Fdiv>\n                  <div style=\"display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px; margin-top:10px\">\n                    <div style=\"font-size:15px; font-weight:600\">{{ b.local }}<\u002Fdiv>\n                    <div style=\"font-size:22px; font-weight:800; font-variant-numeric:tabular-nums\">{{ b.gl }}<\u002Fdiv>\n                    <div style=\"font-size:15px; font-weight:600\">{{ b.visita }}<\u002Fdiv>\n                    <div style=\"font-size:22px; font-weight:800; font-variant-numeric:tabular-nums\">{{ b.gv }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:10px\">{{ b.detalle }}<\u002Fdiv>\n                  <div style=\"font-size:11px; color:var(--color-neutral-700); margin-top:4px\">{{ b.mesa }}<\u002Fdiv>\n                  <div style=\"display:flex; gap:8px; margin-top:14px; flex-wrap:wrap\">\n                    <button sc-camel-on-click=\"{{ b.confirmar }}\" style=\"border:0; background:var(--color-accent); color:var(--color-neutral-100); padding:9px 14px; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; text-align:left\" style-hover=\"background:var(--color-accent-600)\" style-active=\"background:var(--color-accent-700); transform:translateY(1px)\">{{ icoOk }}Confirmar<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ b.rechazar }}\" style=\"display:inline-flex; align-items:center; gap:8px; background:transparent; border:2px solid var(--color-text); padding:7px 14px; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase\" style-hover=\"background:var(--color-bg)\">{{ icoUndo }}Devolver<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <h2 style=\"margin:32px 0 0; font-size:14px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; border-bottom:2px solid var(--color-text); padding-bottom:8px\">Ya publicados<\u002Fh2>\n            <div style=\"overflow-x:auto\">\n            <div style=\"min-width:560px\">\n            <sc-for list=\"{{ publicados }}\" as=\"m\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid; grid-template-columns:90px minmax(0,1fr) 70px minmax(0,1fr) 96px; gap:10px; padding:12px 0; border-bottom:1px solid var(--color-neutral-300); align-items:center\">\n                <div>\n                  <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-neutral-700)\">J{{ m.jornada }} · {{ m.fecha }}<\u002Fdiv>\n                  <div style=\"font-size:11px; color:var(--color-neutral-700)\">{{ m.mesa }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:14px; font-weight:{{ m.wl }}; text-align:right\">{{ m.local }}<\u002Fdiv>\n                <div style=\"text-align:center; font-size:16px; font-weight:800; font-variant-numeric:tabular-nums\">{{ m.score }}<\u002Fdiv>\n                <div style=\"font-size:14px; font-weight:{{ m.wv }}\">{{ m.visita }}<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ m.corregir }}\" style=\"display:inline-flex; align-items:center; gap:8px; background:transparent; border:0; padding:{{ padGhost }}; text-align:left; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-neutral-700)\" style-hover=\"color:var(--color-accent)\">Corregir<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fdiv>\n\n            <h2 style=\"margin:32px 0 0; font-size:14px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; border-bottom:2px solid var(--color-text); padding-bottom:8px\">Historial de cambios<\u002Fh2>\n            <sc-for list=\"{{ auditoria }}\" as=\"a\" hint-placeholder-count=\"2\">\n              <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 110px; gap:10px; padding:11px 0; border-bottom:1px solid var(--color-neutral-300); align-items:baseline\">\n                <div style=\"font-size:13px\">{{ a.texto }}<\u002Fdiv>\n                <div style=\"font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-neutral-700)\">{{ a.quien }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ sinAuditoria }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"border-top:2px solid var(--color-text); margin-top:14px; padding:22px 0 8px\">\n                    <div style=\"font-size:18px; font-weight:800; letter-spacing:-0.02em\">Historial limpio<\u002Fdiv>\n                    <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:44ch; text-wrap:pretty\">Toda anulación o cambio de marcador queda registrado aquí con su autor y su hora.<\u002Fdiv>\n                  <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ esTabla }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:{{ animPantalla }}\">\n            <h1 style=\"margin:0; font-size:28px; font-weight:800; letter-spacing:-0.02em\">Tabla de posiciones<\u002Fh1>\n            <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:4px\">{{ catNombre }} · actualizada al confirmar cada partido<\u002Fdiv>\n            <div style=\"border-bottom:2px solid var(--color-text); margin-top:12px\"><\u002Fdiv>\n            <div style=\"overflow-x:auto\">\n              <div style=\"min-width:620px\">\n                <div style=\"display:grid; grid-template-columns:34px minmax(0,1fr) repeat(7,46px); padding:10px 0; border-bottom:2px solid var(--color-text); font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-700)\">\n                  <div>#<\u002Fdiv><div>Equipo<\u002Fdiv>\n                  <div style=\"text-align:right\">PJ<\u002Fdiv><div style=\"text-align:right\">G<\u002Fdiv><div style=\"text-align:right\">E<\u002Fdiv><div style=\"text-align:right\">P<\u002Fdiv><div style=\"text-align:right\">{{ lblGF }}<\u002Fdiv><div style=\"text-align:right\">{{ lblDG }}<\u002Fdiv><div style=\"text-align:right\">PTS<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ tabla }}\" as=\"t\" hint-placeholder-count=\"8\">\n                  <div>\n                    <div sc-camel-on-click=\"{{ t.toggle }}\" style=\"display:grid; grid-template-columns:34px minmax(0,1fr) repeat(7,46px); padding:13px 0; border-bottom:{{ t.filaRule }}; background:{{ t.filaBg }}; align-items:center; font-variant-numeric:tabular-nums; cursor:pointer\" style-hover=\"background:var(--color-surface)\" style-active=\"background:var(--color-neutral-200); transform:translateY(1px)\">\n                      <div style=\"font-size:14px; font-weight:800; color:{{ t.posFg }}\">{{ t.pos }}<\u002Fdiv>\n                      <div style=\"display:flex; align-items:center; gap:10px\">\n                        <span style=\"width:26px; height:26px; flex:0 0 26px; background:var(--color-surface); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:var(--color-neutral-700)\">{{ t.ini }}<\u002Fspan>\n                        <span style=\"font-size:14px; font-weight:600\">{{ t.equipo }}<\u002Fspan>\n                        <span style=\"font-size:13px; font-weight:800; color:var(--color-neutral-700)\">{{ t.flecha }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"text-align:right; font-size:13px; color:var(--color-neutral-700)\">{{ t.pj }}<\u002Fdiv>\n                      <div style=\"text-align:right; font-size:13px\">{{ t.g }}<\u002Fdiv>\n                      <div style=\"text-align:right; font-size:13px\">{{ t.e }}<\u002Fdiv>\n                      <div style=\"text-align:right; font-size:13px\">{{ t.p }}<\u002Fdiv>\n                      <div style=\"text-align:right; font-size:13px\">{{ t.gf }}<\u002Fdiv>\n                      <div style=\"text-align:right; font-size:13px\">{{ t.dg }}<\u002Fdiv>\n                      <div style=\"text-align:right; font-size:{{ t.ptsSize }}; font-weight:800\">{{ t.pts }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ t.abierto }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"background:var(--color-surface); padding:16px; border-bottom:1px solid var(--color-neutral-300); animation:rise .16s ease-out\">\n                        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:20px\">\n                          <div>\n                            <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700)\">Últimos partidos<\u002Fdiv>\n                            <div style=\"display:flex; gap:6px; margin-top:8px\">\n                              <sc-for list=\"{{ t.racha }}\" as=\"r\" hint-placeholder-count=\"5\">\n                                <span title=\"{{ r.detalle }}\" style=\"width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; background:{{ r.bg }}; color:{{ r.fg }}\">{{ r.r }}<\u002Fspan>\n                              <\u002Fsc-for>\n                            <\u002Fdiv>\n                            <sc-if value=\"{{ t.sinRacha }}\" hint-placeholder-val=\"{{ false }}\">\n                              <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:8px\">Todavía no juega.<\u002Fdiv>\n                            <\u002Fsc-if>\n                          <\u002Fdiv>\n                          <div>\n                            <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700)\">Próximo partido<\u002Fdiv>\n                            <div style=\"font-size:13px; margin-top:8px\">{{ t.proximo }}<\u002Fdiv>\n                          <\u002Fdiv>\n                          <div>\n                            <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700)\">Máximo anotador<\u002Fdiv>\n                            <div style=\"font-size:13px; margin-top:8px\">{{ t.topGol }}<\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:8px; font-size:12px; color:var(--color-neutral-700); margin-top:12px\"><span style=\"width:22px; height:2px; background:var(--color-accent); display:block\"><\u002Fspan>Sobre la línea roja: clasifican a la final. {{ tablaNota }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ esStats }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:{{ animPantalla }}\">\n            <h1 style=\"margin:0; font-size:28px; font-weight:800; letter-spacing:-0.02em\">Estadísticas<\u002Fh1>\n            <div style=\"border-bottom:2px solid var(--color-text); margin-top:12px\"><\u002Fdiv>\n            <sc-if value=\"{{ statsVoley }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:560px; margin-top:22px\">\n                <h2 style=\"margin:0; font-size:14px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; border-bottom:2px solid var(--color-text); padding-bottom:8px\">Rendimiento por equipo<\u002Fh2>\n                <sc-for list=\"{{ tabla }}\" as=\"t\" hint-placeholder-count=\"5\">\n                  <div style=\"display:grid; grid-template-columns:26px minmax(0,1fr) 60px 60px 60px; gap:10px; padding:12px 0; border-bottom:1px solid var(--color-neutral-300); align-items:center; font-variant-numeric:tabular-nums\">\n                    <div style=\"font-size:13px; font-weight:800; color:{{ t.posFg }}\">{{ t.pos }}<\u002Fdiv>\n                    <div style=\"font-size:14px; font-weight:600\">{{ t.equipo }}<\u002Fdiv>\n                    <div style=\"text-align:right; font-size:13px; color:var(--color-neutral-700)\">{{ t.pj }} PJ<\u002Fdiv>\n                    <div style=\"text-align:right; font-size:13px\">{{ t.gf }} SF<\u002Fdiv>\n                    <div style=\"text-align:right; font-size:13px\">{{ t.dg }} DS<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:16px\">El vóley no lleva goleadores ni tarjetas: las anotaciones individuales quedan en la planilla de cada set y las amonestaciones las resuelve el árbitro en cancha.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ statsFutbol }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:32px; margin-top:22px\">\n              <div>\n                <h2 style=\"margin:0; font-size:14px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; border-bottom:2px solid var(--color-text); padding-bottom:8px\">Tabla de goleadores<\u002Fh2>\n                <sc-for list=\"{{ goleadores }}\" as=\"g\" hint-placeholder-count=\"6\">\n                  <div style=\"display:grid; grid-template-columns:26px minmax(0,1fr) 44px; gap:10px; padding:11px 0; border-bottom:1px solid var(--color-neutral-300); align-items:center; font-variant-numeric:tabular-nums\">\n                    <div style=\"font-size:13px; font-weight:800; color:{{ g.posFg }}\">{{ g.pos }}<\u002Fdiv>\n                    <div>\n                      <div style=\"font-size:14px; font-weight:600\">{{ g.nombre }}<\u002Fdiv>\n                      <div style=\"font-size:12px; color:var(--color-neutral-700)\">{{ g.equipo }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"text-align:right; font-size:18px; font-weight:800\">{{ g.goles }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div>\n                <h2 style=\"margin:0; font-size:14px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; border-bottom:2px solid var(--color-text); padding-bottom:8px\">Tarjetas<\u002Fh2>\n                <sc-for list=\"{{ tarjetas }}\" as=\"t\" hint-placeholder-count=\"6\">\n                  <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 40px 40px; gap:10px; padding:11px 0; border-bottom:1px solid var(--color-neutral-300); align-items:center; font-variant-numeric:tabular-nums\">\n                    <div>\n                      <div style=\"font-size:14px; font-weight:600\">{{ t.nombre }}<\u002Fdiv>\n                      <div style=\"font-size:12px; color:var(--color-neutral-700)\">{{ t.equipo }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"text-align:right; font-size:14px; font-weight:700; color:var(--color-neutral-700)\">{{ t.amarillas }}A<\u002Fdiv>\n                    <div style=\"text-align:right; font-size:14px; font-weight:800; color:var(--color-accent-700)\">{{ t.rojas }}R<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <h2 style=\"margin:34px 0 0; font-size:14px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; border-bottom:2px solid var(--color-text); padding-bottom:8px\">Sanciones activas<\u002Fh2>\n            <div style=\"overflow-x:auto\">\n            <div style=\"min-width:520px\">\n            <sc-for list=\"{{ sanciones }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1.2fr) 130px 120px; gap:12px; padding:13px 0; border-bottom:1px solid var(--color-neutral-300); align-items:center\">\n                <div style=\"font-size:14px; font-weight:600\">{{ s.nombre }}<\u002Fdiv>\n                <div style=\"font-size:13px; color:var(--color-neutral-700)\">{{ s.equipo }}<\u002Fdiv>\n                <div style=\"font-size:13px\">{{ s.motivo }}<\u002Fdiv>\n                <div><span style=\"font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; padding:3px 7px; background:var(--color-accent-200); color:var(--color-accent-800)\">{{ s.restante }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ sinSanciones }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:2px solid var(--color-text); margin-top:14px; padding:22px 0 8px\">\n                    <div style=\"font-size:18px; font-weight:800; letter-spacing:-0.02em\">Ningún suspendido<\u002Fdiv>\n                    <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:6px; max-width:44ch; text-wrap:pretty\">Las expulsiones y la acumulación de amarillas entran solas al confirmar cada resultado.<\u002Fdiv>\n                  <\u002Fdiv>\n            <\u002Fsc-if>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ esPagos }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:{{ animPantalla }}\">\n            <h1 style=\"margin:0; font-size:28px; font-weight:800; letter-spacing:-0.02em\">Pagos y cuotas<\u002Fh1>\n            <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:4px\">{{ textoCuotas }}<\u002Fdiv>\n            <div style=\"border-bottom:2px solid var(--color-text); margin-top:12px\"><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); border-bottom:2px solid var(--color-text)\">\n              <sc-for list=\"{{ resumenPagos }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div style=\"padding:16px; border-right:1px solid var(--color-neutral-300)\">\n                  <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700)\">{{ r.label }}<\u002Fdiv>\n                  <div style=\"font-size:28px; font-weight:800; letter-spacing:-0.03em; margin-top:6px; color:{{ r.color }}\">{{ r.valor }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"overflow-x:auto; margin-top:6px\">\n              <div style=\"min-width:640px\">\n                <div style=\"display:grid; grid-template-columns:minmax(0,1.6fr) 110px 110px 110px 130px; gap:12px; padding:10px 0; border-bottom:2px solid var(--color-text); font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-neutral-700)\">\n                  <div>Equipo<\u002Fdiv><div>Inscripción<\u002Fdiv><div>Cuotas<\u002Fdiv><div>Saldo<\u002Fdiv><div><\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ pagos }}\" as=\"p\" hint-placeholder-count=\"8\">\n                  <div style=\"display:grid; grid-template-columns:minmax(0,1.6fr) 110px 110px 110px 130px; gap:12px; padding:12px 0; border-bottom:1px solid var(--color-neutral-300); align-items:center; font-variant-numeric:tabular-nums\">\n                    <div style=\"font-size:14px; font-weight:600\">{{ p.equipo }}<\u002Fdiv>\n                    <div style=\"font-size:13px; color:{{ p.insFg }}\">{{ p.inscripcion }}<\u002Fdiv>\n                    <div style=\"font-size:13px\">{{ p.cuotas }}<\u002Fdiv>\n                    <div style=\"font-size:14px; font-weight:700; color:{{ p.saldoFg }}\">{{ p.saldo }}<\u002Fdiv>\n                    <div>\n                      <sc-if value=\"{{ p.debe }}\" hint-placeholder-val=\"{{ true }}\">\n                        <button sc-camel-on-click=\"{{ p.cobrar }}\" style=\"background:transparent; border:2px solid var(--color-text); padding:{{ padSec }}; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; text-align:left\" style-hover=\"background:var(--color-surface)\" style-active=\"background:var(--color-neutral-200); transform:translateY(1px)\">Registrar pago<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ esPlanilla }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:{{ animPantalla }}\">\n            <sc-if value=\"{{ enControl }}\" hint-placeholder-val=\"{{ false }}\">\n              <div>\n                <div style=\"font-size:10px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--color-accent-700)\">Antes de iniciar · control de habilitación<\u002Fdiv>\n                <h1 style=\"margin:6px 0 0; font-size:24px; font-weight:800; letter-spacing:-0.02em\">{{ vivo.local }} vs {{ vivo.visita }}<\u002Fh1>\n                <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:4px\">Jornada {{ vivo.jornada }} · {{ vivo.fecha }} · {{ vivo.cancha }}<\u002Fdiv>\n                <div style=\"border-bottom:2px solid var(--color-text); margin-top:12px\"><\u002Fdiv>\n\n                <sc-if value=\"{{ hayDeuda }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"background:var(--color-accent-100); padding:14px; margin-top:14px\">\n                    <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-accent-700)\">Cuota pendiente<\u002Fdiv>\n                    <div style=\"font-size:13px; margin-top:4px\">{{ avisoDeuda }}. Puedes dejar jugar y cobrar al final, pero queda registrado.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:28px; margin-top:20px\">\n                  <div>\n                    <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding-bottom:8px; border-bottom:2px solid var(--color-text)\">\n                      <span style=\"font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase\">{{ vivo.local }}<\u002Fspan>\n                      <span style=\"font-size:11px; font-weight:700; color:var(--color-neutral-700)\">{{ presLocal }} en cancha<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ controlLocal }}\" as=\"p\" hint-placeholder-count=\"8\">\n                      <div style=\"display:grid; grid-template-columns:38px 30px minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--color-neutral-300); background:{{ p.fila }}\">\n                        <div style=\"width:38px; height:38px; background:var(--color-surface); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--color-neutral-700)\">{{ p.ini }}<\u002Fdiv>\n                        <div style=\"font-size:13px; font-weight:800; font-variant-numeric:tabular-nums\">{{ p.dorsal }}<\u002Fdiv>\n                        <div>\n                          <div style=\"font-size:13px; font-weight:600\">{{ p.nombre }}<\u002Fdiv>\n                          <div style=\"font-size:11px; color:var(--color-neutral-700); font-variant-numeric:tabular-nums\">DNI {{ p.dni }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <button sc-camel-on-click=\"{{ p.toggle }}\" style=\"background:transparent; border:0; padding:{{ padGhost }}; text-align:left; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:{{ p.accionFg }}\" style-hover=\"color:var(--color-accent)\">{{ p.accion }}<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding-bottom:8px; border-bottom:2px solid var(--color-text)\">\n                      <span style=\"font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase\">{{ vivo.visita }}<\u002Fspan>\n                      <span style=\"font-size:11px; font-weight:700; color:var(--color-neutral-700)\">{{ presVisita }} en cancha<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ controlVisita }}\" as=\"p\" hint-placeholder-count=\"8\">\n                      <div style=\"display:grid; grid-template-columns:38px 30px minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--color-neutral-300); background:{{ p.fila }}\">\n                        <div style=\"width:38px; height:38px; background:var(--color-surface); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--color-neutral-700)\">{{ p.ini }}<\u002Fdiv>\n                        <div style=\"font-size:13px; font-weight:800; font-variant-numeric:tabular-nums\">{{ p.dorsal }}<\u002Fdiv>\n                        <div>\n                          <div style=\"font-size:13px; font-weight:600\">{{ p.nombre }}<\u002Fdiv>\n                          <div style=\"font-size:11px; color:var(--color-neutral-700); font-variant-numeric:tabular-nums\">DNI {{ p.dni }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <button sc-camel-on-click=\"{{ p.toggle }}\" style=\"background:transparent; border:0; padding:{{ padGhost }}; text-align:left; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:{{ p.accionFg }}\" style-hover=\"color:var(--color-accent)\">{{ p.accion }}<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:24px; border-top:2px solid var(--color-text); padding-top:16px\">\n                  <div style=\"font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700)\">Delegado de mesa · quién controla este partido<\u002Fdiv>\n                  <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:10px\">\n                    <sc-for list=\"{{ mesaLista }}\" as=\"m\" hint-placeholder-count=\"4\">\n                      <button sc-camel-on-click=\"{{ m.pick }}\" style=\"display:inline-flex; align-items:center; gap:9px; border:2px solid {{ m.bd }}; background:{{ m.bg }}; color:{{ m.fg }}; padding:{{ padSec }}; font-size:12px; font-weight:700\" style-hover=\"border-color:var(--color-text)\" style-active=\"transform:translateY(1px)\">\n                        <span style=\"width:24px; height:24px; flex:0 0 24px; background:var(--color-surface); color:var(--color-neutral-700); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800\">{{ m.ini }}<\u002Fspan>{{ m.nombre }}\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ faltaMesa }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"font-size:13px; color:var(--color-accent-700); margin-top:10px\">Elige quién está en la mesa: su nombre queda pegado a este resultado.<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <div style=\"display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; border-top:2px solid var(--color-text); padding-top:16px\">\n                  <sc-if value=\"{{ puedeIniciar }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ iniciarPartido }}\" style=\"border:0; background:var(--color-accent); color:var(--color-neutral-100); padding:11px 16px; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; text-align:left\" style-hover=\"background:var(--color-accent-600)\" style-active=\"background:var(--color-accent-700); transform:translateY(1px)\">{{ icoUser }}Iniciar partido<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <button sc-camel-on-click=\"{{ woLocal }}\" style=\"background:transparent; border:2px solid var(--color-text); padding:{{ padSec }}; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase\" style-hover=\"background:var(--color-surface)\" style-active=\"background:var(--color-neutral-200); transform:translateY(1px)\">W.O. de {{ vivo.local }}<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ woVisita }}\" style=\"background:transparent; border:2px solid var(--color-text); padding:{{ padSec }}; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase\" style-hover=\"background:var(--color-surface)\" style-active=\"background:var(--color-neutral-200); transform:translateY(1px)\">W.O. de {{ vivo.visita }}<\u002Fbutton>\n                  <butt eric:tabular-nums; line-height:1; animation:{{ animPulso }}\">{{ vivo.gl }} – {{ vivo.gv }}<\u002Fdiv>\n                    <div style=\"background:{{ relojBg }}; color:{{ relojInk }}; padding:{{ relojPad }}; min-width:{{ relojMin }}\">\n                      <div style=\"display:flex; align-items:center; justify-content:center; gap:9px\">\n                        <span style=\"width:7px; height:7px; flex:0 0 7px; background:{{ relojBarraBg }}; display:block; animation:{{ animPunto }}\"><\u002Fspan>\n                        <span style=\"font-size:{{ relojSize }}; font-weight:800; letter-spacing:0.01em; font-variant-numeric:tabular-nums; line-height:1\">{{ vivo.reloj }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:9px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; opacity:0.72; margin-top:5px\">{{ limiteTexto }}<\u002Fdiv>\n                      <div style=\"height:4px; background:color-mix(in srgb, {{ relojInk }} 26%, transparent); margin-top:8px\">\n                        <div style=\"height:4px; width:{{ relojBarra }}; background:{{ relojBarraBg }}\"><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; align-items:center; justify-content:{{ justVisita }}; gap:12px\">\n                    <span style=\"width:{{ escudoPx }}; height:{{ escudoPx }}; flex:0 0 auto; background:var(--color-surface); display:flex; align-items:center; justify-content:center; font-size:{{ escudoFs }}; font-weight:800; color:var(--color-neutral-700)\">{{ vivo.iniVisita }}<\u002Fspan>\n                    <span style=\"font-size:22px; font-weight:800; letter-spacing:-0.02em\">{{ vivo.visita }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ tiempoCumplido }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"background:var(--color-accent); col
